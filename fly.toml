# No app name here: deploy with `fly deploy --ha=false -a <your-app>`.
# PUBLIC_URL and ADMIN_KEY are Fly secrets.
primary_region = "syd"
# Room for the server's 5 second graceful shutdown.
kill_timeout = "10s"

[build]

[env]
  # The server exits after an hour with no requests and no open pages; Fly starts it again on the next request.
  IDLE_EXIT_MS = "3600000"
  # Fly's proxy sets this to the visitor's address; anything else could be faked.
  CLIENT_IP_HEADER = "Fly-Client-IP"

[[mounts]]
  source = "counter_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    timeout = "3s"
    method = "GET"
    path = "/healthz"

[[restart]]
  policy = "on-failure"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
