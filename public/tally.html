<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{name}} - FreeTally</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%231f6f4a%22/%3E%3Cpath d=%22M4 3v10M7 3v10M10 3v10M2 11l12-6%22 stroke=%22%23fff%22 stroke-width=%221.5%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
  <link rel="modulepreload" href="/live.js">
  <link rel="modulepreload" href="/fx.js">
  <script type="module" src="/tally.js" blocking="render"></script>
  <script id="snapshot" type="application/json">{{snapshot}}</script>
</head>
<body>
  <main>
    <header class="top">
      <h1 id="title">{{name}}</h1>
      <span id="status" class="status off">&#9679; Connecting</span>
    </header>
    <button id="edit-open" type="button" class="link edit-open" hidden>Edit name or capacity</button>

    <div id="total-box" class="total">
      <output id="total" aria-live="polite">0</output>
      <p id="capacity" class="capacity slot"></p>
      <p id="visitors" class="muted slot"></p>
      <p id="pending" class="muted slot"></p>
    </div>

    <section id="controls">
      <p class="who slot">
        <span id="who-named" hidden>Counting as <strong id="who"></strong> <button id="rename" type="button" class="link">change</button></span>
        <span id="who-unnamed" hidden><button id="name-open" type="button" class="link">Add your name</button> to start counting</span>
        <span id="who-closed" hidden></span>
      </p>
      <div class="quick">
        <button type="button" class="tap minus" data-delta="-1">-1</button>
        <button type="button" class="tap" data-delta="1">+1</button>
        <button type="button" class="tap" data-delta="2">+2</button>
      </div>
      <form id="adjust" class="row">
        <label for="amount" class="sr-only">Amount</label>
        <input id="amount" type="number" inputmode="numeric" min="1" step="1" placeholder="Amount">
        <button type="button" data-sign="1">Add</button>
        <button type="button" data-sign="-1">Subtract</button>
      </form>
    </section>

    <details id="share">
      <summary>Share this tally</summary>
      <img id="qr" alt="QR code linking to this tally" width="240" height="240">
      <div class="row">
        <input id="link" readonly aria-label="Link to this tally">
        <button id="copy" type="button">Copy</button>
      </div>
      <p><a id="screen-link" href="#">Open the big-screen view</a> <span class="muted">for a TV or projector.</span></p>
    </details>
    <script>
      // Runs before the first paint, so the page doesn't jump when the main script loads.
      if (/[?&]new=/.test(location.search)) document.getElementById('share').open = true;
      var ownerStore = 'freetally:owner:' + location.pathname.split('/').pop();
      // An owner link from the admin page: keep the key, then take it out of the address bar so it
      // isn't shared by accident. If storage is blocked it stays in the address for tally.js to read.
      var ownerLink = /[#&]owner=([A-Za-z0-9_-]+)/.exec(location.hash);
      if (ownerLink) {
        document.getElementById('edit-open').hidden = false;
        try {
          localStorage.setItem(ownerStore, JSON.stringify(ownerLink[1]));
          history.replaceState(history.state, '', location.pathname + location.search);
        } catch (e) {}
      }
      try {
        var named = JSON.parse(localStorage.getItem('freetally:name') || '""');
        document.getElementById(named ? 'who-named' : 'who-unnamed').hidden = false;
        document.getElementById('who').textContent = named;
        if (localStorage.getItem(ownerStore)) document.getElementById('edit-open').hidden = false;
      } catch (e) {
        document.getElementById('who-unnamed').hidden = false;
      }
    </script>

    <section>
      <h2>Last 15 minutes</h2>
      <p id="recent-summary" class="muted slot"></p>
      <ol id="people" class="people"></ol>
    </section>

    <section>
      <h2>History</h2>
      <p id="empty" class="muted">Nothing counted yet.</p>
      <ol id="history" class="history"></ol>
      <button id="history-toggle" type="button" class="link" hidden></button>
      <p id="history-note" class="muted" hidden></p>
    </section>
  </main>

  <dialog id="name-dialog" aria-labelledby="name-heading">
    <form id="name-form" method="dialog">
      <h2 id="name-heading">Your name</h2>
      <p class="muted">Shown next to each count you add.</p>
      <label for="name-input" class="sr-only">Your name</label>
      <input id="name-input" maxlength="40" required autocomplete="nickname">
      <p id="name-warning" class="warning" hidden></p>
      <div class="row dialog-actions">
        <button type="submit" class="primary">Start counting</button>
        <button id="name-cancel" type="button">Just watching</button>
      </div>
    </form>
  </dialog>

  <dialog id="edit-dialog" aria-labelledby="edit-heading">
    <form id="edit" method="dialog">
      <h2 id="edit-heading">Edit this tally</h2>
      <label for="edit-name">What are you counting?</label>
      <input id="edit-name" maxlength="80" required autocomplete="off">
      <label for="edit-capacity">Capacity <span class="muted">(optional)</span></label>
      <input id="edit-capacity" type="number" inputmode="numeric" min="1" step="1">
      <p id="edit-error" class="error" role="alert" hidden></p>
      <div class="row dialog-actions">
        <button type="submit" class="primary">Save</button>
        <button id="edit-cancel" type="button">Cancel</button>
      </div>
    </form>
  </dialog>

  <div class="toasts">
    <div id="error-toast" class="toast error-toast" role="alert" hidden></div>
    <div id="undo" class="toast" role="status" hidden>
      <span id="undo-text"></span>
      <button id="undo-button" type="button">Undo</button>
    </div>
  </div>
</body>
</html>
